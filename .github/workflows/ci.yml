name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Test installer
        if: runner.os == 'Linux'
        run: scripts/install_test.sh

      - name: Run vet
        run: go vet ./...

      - name: Build CLI
        run: go build -o canvas .
