name: Bug report
description: Record a reproducible Canvas CLI defect with bounded evidence.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, including the command shape with all secrets and real data removed?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Prefer a local fixture or redacted mock response. Never paste a Canvas token or student/course data.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and environment
      description: Include `canvas --version`, OS, exit status, and redacted structured output when relevant.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable checks prove the defect is fixed without regressing nearby behavior?
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed tokens, real Canvas URLs, course/student data, and submission content.
          required: true
